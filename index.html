<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trampolin-Energie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      margin: 0;
      padding: 8px 8px 20px;
      font-family: sans-serif;
      overflow-y: auto;
    }

    /* SVG scales with container, never wider than viewport */
    #scene {
      width: 100%;
      max-width: 600px;
      height: auto;
    }

    /* All panels share the same fluid width */
    #paramBox, #controls, #energyBox {
      width: 100%;
      max-width: 600px;
    }

    button {
      padding: 10px 28px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid #555;
      background: #fff;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    button:hover { background: #e0e0e0; }

    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    #phaseSlider {
      flex: 1;
      accent-color: #8B2FC9;
      min-width: 0;
      height: 36px;   /* tall touch target */
      cursor: pointer;
    }
    #phaseLabel {
      font-size: 12px;
      color: #555;
      width: 38px;
      text-align: right;
      flex-shrink: 0;
    }

    #paramBox {
      background: #fff;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    #paramBox h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    .prow {
      display: flex;
      align-items: center;
      margin-bottom: 2px;
      gap: 8px;
    }
    .prow:last-child { margin-bottom: 0; }
    .plabel {
      width: 150px;
      font-size: 12px;
      color: #444;
      flex-shrink: 0;
    }
    .prow input[type=range] {
      flex: 1;
      min-width: 0;
      accent-color: #8B2FC9;
      height: 36px;   /* tall touch target */
      cursor: pointer;
    }
    .pval {
      width: 66px;
      text-align: right;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
    }

    #energyBox {
      margin-top: 10px;
      background: #fff;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      padding: 12px 14px;
    }
    #energyBox h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }
    .erow {
      display: flex;
      align-items: center;
      margin-bottom: 7px;
      gap: 8px;
    }
    .erow:last-child { margin-bottom: 0; }
    .elabel {
      width: 120px;
      font-size: 12px;
      color: #444;
      flex-shrink: 0;
    }
    .ebar-bg {
      flex: 1;
      min-width: 0;
      height: 14px;
      position: relative;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }
    .ebar-zero-marker {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #aaa;
      z-index: 1;
    }
    .ebar-neg-fill {
      position: absolute;
      top: 0; bottom: 0;
      background: #888;   /* overridden inline */
      border-radius: 4px 0 0 4px;
    }
    .ebar-pos-fill {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 0 4px 4px 0;
    }
    .ebar-stacked-fill {
      position: absolute;
      top: 0; height: 100%;
    }

    #stackedRow, #legendRow { display: none; }
    .eval {
      width: 56px;
      text-align: right;
      font-size: 12px;
      color: #555;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1 style="font-size:22px; font-weight:bold; color:#333; margin:8px 0 4px; text-align:center; width:100%; max-width:600px;">Trampolin-Simulation</h1>

  <svg id="scene" width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#cc2222"/>
      </marker>
      <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#2255cc"/>
      </marker>
      <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#228833"/>
      </marker>
    </defs>

    <!-- Trampolin-Rahmen -->
    <line x1="20"  y1="240" x2="20"  y2="380" stroke="black" stroke-width="6"/>
    <line x1="455" y1="240" x2="455" y2="380" stroke="black" stroke-width="6"/>
    <line x1="0"   y1="380" x2="45"  y2="380" stroke="black" stroke-width="4"/>
    <line x1="430" y1="380" x2="480" y2="380" stroke="black" stroke-width="4"/>

    <!-- Energie-Balken (SVG, rechts) -->
    <!-- Nulllinie -->
    <line x1="460" y1="240" x2="562" y2="240" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>
    <!-- Bereich-Hintergründe (min–max über eine Periode) -->
    <rect id="svgRangePot" x="467" width="21" y="240" height="0" fill="#e08800" opacity="0.18"/>
    <rect id="svgRangeKin" x="499" width="21" y="240" height="0" fill="#228833" opacity="0.18"/>
    <rect id="svgRangeSpr" x="531" width="21" y="240" height="0" fill="#2255cc" opacity="0.18"/>
    <!-- Balken -->
    <rect id="svgBarPot" x="467" width="21" y="240" height="0" fill="#e08800" opacity="0.85"/>
    <rect id="svgBarKin" x="499" width="21" y="240" height="0" fill="#228833" opacity="0.85"/>
    <rect id="svgBarSpr" x="531" width="21" y="240" height="0" fill="#2255cc" opacity="0.85"/>
    <!-- Kategorie-Labels (fix unter Nulllinie) -->
    <text x="477" y="268" text-anchor="middle" font-size="11" fill="#e08800" font-weight="bold">E<tspan dy="3" font-size="8">p</tspan></text>
    <text x="509" y="268" text-anchor="middle" font-size="11" fill="#228833" font-weight="bold">E<tspan dy="3" font-size="8">k</tspan></text>
    <text x="541" y="268" text-anchor="middle" font-size="11" fill="#2255cc" font-weight="bold">E<tspan dy="3" font-size="8">f</tspan></text>

    <!-- Trampolin-Tuch -->
    <path id="trampoline" fill="none" stroke="black" stroke-width="3"/>

    <!-- Kugel -->
    <circle id="ball" r="18" fill="#8B2FC9" stroke="#5a1a8a" stroke-width="2"/>

    <!-- Gewichtskraft (rot, nach unten) -->
    <line id="fgArrow" stroke="#cc2222" stroke-width="2.5" marker-end="url(#arrowRed)"/>

    <!-- Federkraft (blau, nach oben) -->
    <line id="fsArrow" stroke="#2255cc" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <!-- Geschwindigkeitsvektor (grün) -->
    <line id="vArrow" stroke="#228833" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

    <!-- Nullpunkt-Ticks (bewegen sich mit der Kugel) -->
    <line id="tickFg" stroke="#cc2222" stroke-width="1" opacity="0.5"/>
    <line id="tickFs" stroke="#2255cc" stroke-width="1" opacity="0.5"/>
    <line id="tickV"  stroke="#228833" stroke-width="1" opacity="0.5"/>

    <!-- Labels -->
    <text id="labelFg" fill="#cc2222" font-size="11" text-anchor="middle"></text>
    <text id="labelFs" fill="#2255cc" font-size="11" text-anchor="middle"></text>
    <text id="labelV"  fill="#228833" font-size="11" text-anchor="middle" font-style="italic"></text>

  </svg>

  <div id="paramBox">
    <h3>Parameter</h3>
    <div class="prow">
      <span class="plabel">Masse m (kg)</span>
      <input id="sliderMass" type="range" min="1" max="5" step="0.5" value="3">
      <span class="pval" id="valMass"></span>
    </div>
    <div class="prow">
      <span class="plabel">Abwurfhöhe h (m)</span>
      <input id="sliderHeight" type="range" min="0.2" max="1" step="0.1" value="1">
      <span class="pval" id="valHeight"></span>
    </div>
    <div class="prow">
      <span class="plabel">Federkonstante k (N/m)</span>
      <input id="sliderK" type="range" min="0" max="1000" step="1" value="148">
      <span class="pval" id="valK"></span>
    </div>
  </div>

  <div id="controls">
    <button id="btnToggle">Start</button>
    <input id="phaseSlider" type="range" min="0" max="1000" value="0" step="1">
    <span id="phaseLabel">0 %</span>
    <button id="btnReset">Reset</button>
  </div>

  <div id="energyBox">
    <h3>Energiebilanz</h3>
    <div id="rowPot" class="erow">
      <span class="elabel">Lageenergie E&#x209A;</span>
      <div class="ebar-bg">
        <div class="ebar-zero-marker" id="zeroPot"></div>
        <div class="ebar-neg-fill" id="barPotNeg" style="background:#e08800"></div>
        <div class="ebar-pos-fill" id="barPotPos" style="background:#e08800"></div>
      </div>
      <span class="eval" id="valPot">0 J</span>
    </div>
    <div id="rowKin" class="erow">
      <span class="elabel">Kinetische E. E<sub>k</sub></span>
      <div class="ebar-bg">
        <div class="ebar-zero-marker" id="zeroKin"></div>
        <div class="ebar-neg-fill" id="barKinNeg" style="background:#228833"></div>
        <div class="ebar-pos-fill" id="barKinPos" style="background:#228833"></div>
      </div>
      <span class="eval" id="valKin">0 J</span>
    </div>
    <div id="rowSpr" class="erow">
      <span class="elabel">Federenergie E<sub>f</sub></span>
      <div class="ebar-bg">
        <div class="ebar-zero-marker" id="zeroSpr"></div>
        <div class="ebar-neg-fill" id="barSprNeg" style="background:#2255cc"></div>
        <div class="ebar-pos-fill" id="barSprPos" style="background:#2255cc"></div>
      </div>
      <span class="eval" id="valSpr">0 J</span>
    </div>

    <!-- Gestapelter Balken -->
    <div id="stackedRow" class="erow">
      <span class="elabel">Energie E</span>
      <div class="ebar-bg">
        <div class="ebar-zero-marker" id="zeroStack"></div>
        <!-- negative Ep (obere Hälfte bei Richtungswechsel) -->
        <div class="ebar-stacked-fill" id="stkPotNeg" style="background:#e08800"></div>
        <!-- positive Ep (volle Höhe) -->
        <div class="ebar-stacked-fill" id="stkPotPos" style="background:#e08800"></div>
        <!-- vertikaler Verbinder am Richtungswechselpunkt -->
        <div class="ebar-stacked-fill" id="stkConnector" style="background:#666;opacity:0.5;z-index:2"></div>
        <!-- Ek -->
        <div class="ebar-stacked-fill" id="stkKin"    style="background:#228833"></div>
        <!-- Ef -->
        <div class="ebar-stacked-fill" id="stkSpr"    style="background:#2255cc"></div>
      </div>
      <span class="eval"></span>
    </div>
    <!-- Legende -->
    <div id="legendRow" style="margin-top:5px; font-size:12px; display:flex; flex-direction:column; gap:3px; padding-left:130px;">
      <span style="color:#e08800">Lageenergie E&#x209A; = <span id="legValPot">0 J</span></span>
      <span style="color:#228833">Kinetische Energie E<sub>k</sub> = <span id="legValKin">0 J</span></span>
      <span style="color:#2255cc">Federenergie E<sub>f</sub> = <span id="legValSpr">0 J</span></span>
    </div>

    <div style="margin-top:10px; font-size:13px; color:#444; display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="chkStack">
      <label for="chkStack">stapeln</label>
    </div>
  </div>

  <script>
    // ── Physikalische Konstanten ──────────────────────────────────────────────
    const g = 9.81;  // m/s²
    const K_MIN  = 200;   // N/m, untere Grenze Federkonstante
    const K_MAX  = 100000; // N/m, obere Grenze Federkonstante
    const K_INIT = 500;    // N/m, Startwert Federkonstante
    let m   = 5;     // kg
    let k   = K_INIT; // N/m
    let h0  = 1.0;   // m  Abwurfhöhe

    let y  = h0;   // m
    let vy = 0.0;  // m/s

    // ── SVG-Koordinaten-Mapping ───────────────────────────────────────────────
    // Trampolin-Ruhelage in SVG: y_svg = 240
    const TRAMP_SVG = 240;   // px, Oberkante Tuch unverformt
    const SCALE     = 100;   // px pro Meter

    // ── DOM-Referenzen ────────────────────────────────────────────────────────
    const ball       = document.getElementById('ball');
    const trampPath  = document.getElementById('trampoline');
    const fgArrow    = document.getElementById('fgArrow');
    const fsArrow    = document.getElementById('fsArrow');
    const vArrow     = document.getElementById('vArrow');
    const labelFg    = document.getElementById('labelFg');
    const labelFs    = document.getElementById('labelFs');
    const labelV     = document.getElementById('labelV');
    const btnToggle   = document.getElementById('btnToggle');
    const btnReset    = document.getElementById('btnReset');
    const phaseSlider  = document.getElementById('phaseSlider');
    const phaseLabel   = document.getElementById('phaseLabel');
    const barPotPos = document.getElementById('barPotPos');
    const barPotNeg = document.getElementById('barPotNeg');
    const barKinPos = document.getElementById('barKinPos');
    const barKinNeg = document.getElementById('barKinNeg');
    const barSprPos = document.getElementById('barSprPos');
    const barSprNeg = document.getElementById('barSprNeg');
    const zeroPot   = document.getElementById('zeroPot');
    const zeroKin   = document.getElementById('zeroKin');
    const zeroSpr   = document.getElementById('zeroSpr');
    const chkStack  = document.getElementById('chkStack');
    const energyBox = document.getElementById('energyBox');
    const zeroStack    = document.getElementById('zeroStack');
    const stkPotNeg    = document.getElementById('stkPotNeg');
    const stkPotPos    = document.getElementById('stkPotPos');
    const stkConnector = document.getElementById('stkConnector');
    const stkKin       = document.getElementById('stkKin');
    const stkSpr       = document.getElementById('stkSpr');

    chkStack.addEventListener('change', applyStackMode);
    function applyStackMode() {
      const s = chkStack.checked;
      document.getElementById('rowPot').style.display    = s ? 'none' : '';
      document.getElementById('rowKin').style.display    = s ? 'none' : '';
      document.getElementById('rowSpr').style.display    = s ? 'none' : '';
      document.getElementById('stackedRow').style.display = s ? 'flex' : 'none';
      document.getElementById('legendRow').style.display  = s ? 'flex' : 'none';
    }
    applyStackMode();
    const valPot  = document.getElementById('valPot');
    const valKin  = document.getElementById('valKin');
    const valSpr  = document.getElementById('valSpr');
    const legValPot = document.getElementById('legValPot');
    const legValKin = document.getElementById('legValKin');
    const legValSpr = document.getElementById('legValSpr');

    // Gesamtenergie bei Start (Referenz für Balkenskalierung) — wird nach Parameteränderung neu gesetzt
    let E_START = m * g * h0;

    // Einheitliche Balkenskalierung — konstant für gegebene Parameter
    // ePos = max. Federenergie = E_START + eNeg, eNeg = |minimale Lageenergie|
    let ePos = E_START;
    let eNeg = 0.01;
    let eScale = ePos + eNeg;
    let zeroPct = eNeg / eScale * 100;

    function computeEScale() {
      const mg = m * g;
      const yMin = k > 0
        ? (-mg - Math.sqrt(mg * mg + 2 * k * E_START)) / k
        : -E_START / mg;
      eNeg   = Math.max(Math.abs(mg * yMin), 0.01);
      ePos   = E_START + eNeg;   // max spring energy (= E_START + mg·|yMin|)
      eScale = ePos + eNeg;
      zeroPct = eNeg / eScale * 100;
    }

    // ── Analytische Periode ───────────────────────────────────────────────────
    let periodTime = 1.0;
    let omegaN, tAir, tSpring, vyImpact, aSpr, bSpr, yEq;

    // Berechnet Perioden-Parameter analytisch
    function computePeriod() {
      omegaN   = Math.sqrt(k / m);
      tAir     = Math.sqrt(2 * h0 / g);           // Fallzeit h0 → 0
      vyImpact = -Math.sqrt(2 * g * h0);           // Aufprallgeschwindigkeit (negativ)
      yEq      = -m * g / k;                       // Gleichgewichtslage
      aSpr     = -yEq;                             // = m·g/k
      bSpr     = vyImpact / omegaN;
      // Kontaktdauer: y(τ)=0 gelöst über Halbwinkel-Substitution
      tSpring  = 2 * (Math.PI + Math.atan(vyImpact * omegaN / g)) / omegaN;
      periodTime = 2 * tAir + tSpring;
    }

    // Gibt {y, vy} für Zeit t innerhalb einer Periode zurück (exakt)
    function stateAtTime(t) {
      if (t <= tAir) {
        // Freier Fall von h0 auf das Tuch
        return { y: h0 - 0.5 * g * t * t, vy: -g * t };
      } else if (t <= tAir + tSpring) {
        // Federkontakt: harmonische Schwingung um yEq
        const tau = t - tAir;
        const wt  = omegaN * tau;
        return {
          y:  yEq + aSpr * Math.cos(wt) + bSpr * Math.sin(wt),
          vy: omegaN * (-aSpr * Math.sin(wt) + bSpr * Math.cos(wt))
        };
      } else {
        // Freier Aufstieg zurück zu h0
        const tau    = t - tAir - tSpring;
        const vyExit = -vyImpact;   // positiv
        return { y: vyExit * tau - 0.5 * g * tau * tau, vy: vyExit - g * tau };
      }
    }

    function precompute() {
      computePeriod();
    }
    // precompute() is called by applyParams() on init below

    // ── Parameter-Slider
    const sliderMass   = document.getElementById('sliderMass');
    const sliderHeight = document.getElementById('sliderHeight');
    const sliderK      = document.getElementById('sliderK');
    const valMassEl    = document.getElementById('valMass');
    const valHeightEl  = document.getElementById('valHeight');
    const valKEl       = document.getElementById('valK');

    function applyParams() {
      m   = parseFloat(sliderMass.value);
      h0  = parseFloat(sliderHeight.value);
      k   = Math.round(K_MIN * Math.pow(K_MAX / K_MIN, sliderK.value / 1000));
      E_START = m * g * h0;
      computeEScale();
      valMassEl.textContent   = `${m} kg`;
      valHeightEl.textContent = `${h0.toFixed(1)} m`;
      valKEl.textContent      = `${k} N/m`;
      // Simulation zurücksetzen + Snapshots neu berechnen
      y = h0; vy = 0.0; phaseTime = 0;
      precompute();
      updateSvgRanges();
      updateSlider();
      render();
    }

    sliderMass.addEventListener('input',   applyParams);
    sliderHeight.addEventListener('input', applyParams);
    sliderK.addEventListener('input',      applyParams);

    // ── Animations-Zustand ────────────────────────────────────────────────────
    let running   = false;
    let lastTime  = null;
    let rafId     = null;
    let phaseTime = 0;   // vergangene Zeit innerhalb der aktuellen Periode (s)
    let seeking   = false;  // true solange der Nutzer den Slider zieht

    // ── Pfeil-Hilfsfunktion ───────────────────────────────────────────────────
    function setArrow(el, x1, y1, x2, y2) {
      // Minimallänge, damit der Marker sichtbar ist
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len < 1) {
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x1); el.setAttribute('y2', y1);
      } else {
        // Verkürze Linie um Marker-Länge (8px) damit Spitze genau bei (x2,y2) endet
        const f = Math.max(0, (len - 8) / len);
        el.setAttribute('x1', x1); el.setAttribute('y1', y1);
        el.setAttribute('x2', x1 + dx * f); el.setAttribute('y2', y1 + dy * f);
      }
    }

    // ── Darstellung aktualisieren ─────────────────────────────────────────────
    // Pfeil-Spalten links der Kugel (Kugelkante bei x=172), äquidistant
    const AX   = [275, 308, 186]; // Fg (rechts), Fs (rechts), v (links)
    const TICK = 8;               // halbe Tick-Länge px
    const tickFg = document.getElementById('tickFg');
    const tickFs = document.getElementById('tickFs');
    const tickV  = document.getElementById('tickV');
    const svgRangePot = document.getElementById('svgRangePot');
    const svgRangeKin = document.getElementById('svgRangeKin');
    const svgRangeSpr = document.getElementById('svgRangeSpr');
    const svgBarPot = document.getElementById('svgBarPot');
    const svgBarKin = document.getElementById('svgBarKin');
    const svgBarSpr = document.getElementById('svgBarSpr');

    function updateSvgRanges() {
      const svgPxPerJ = SCALE / (m * g);  // Ep bar top tracks ball bottom
      const efMax = E_START + eNeg;       // max spring energy
      const ekMax = k > 0 ? E_START + 0.5 * (m * g) * (m * g) / k : E_START;  // max kinetic energy
      // Ep: full range — from E_START above zero down to eNeg below zero
      svgRangePot.setAttribute('y',      TRAMP_SVG - E_START * svgPxPerJ);
      svgRangePot.setAttribute('height', (E_START + eNeg) * svgPxPerJ);
      // Ek: 0 to ekMax
      svgRangeKin.setAttribute('y',      TRAMP_SVG - ekMax * svgPxPerJ);
      svgRangeKin.setAttribute('height', ekMax * svgPxPerJ);
      // Ef: 0 to efMax
      svgRangeSpr.setAttribute('y',      TRAMP_SVG - efMax * svgPxPerJ);
      svgRangeSpr.setAttribute('height', efMax * svgPxPerJ);
    }

    function render() {
      // Kugel-SVG-Position (ballY = Oberkante Kugel in SVG)
      const ballY  = TRAMP_SVG - y * SCALE - 18;
      const ballCY = ballY + 18;  // Kugelmitte

      // Trampolin-Tuch: Bézier-Tiefpunkt liegt bei 0.75*sag
      // → sag = -y * SCALE * (4/3) damit Tuchoberfläche genau unter dem Kugelrand liegt
      const sag = y < 0 ? (-y * SCALE * 4 / 3) : 0;
      const cp  = TRAMP_SVG + sag;
      trampPath.setAttribute('d',
        `M 20,${TRAMP_SVG} C 165,${cp} 310,${cp} 455,${TRAMP_SVG}`);
      ball.setAttribute('cx', 238);
      ball.setAttribute('cy', ballY);

      // Nullpunkt-Ticks auf Kugelmitte-Höhe
      [tickFg, tickFs, tickV].forEach((el, i) => {
        el.setAttribute('x1', AX[i] - TICK); el.setAttribute('y1', ballCY);
        el.setAttribute('x2', AX[i] + TICK); el.setAttribute('y2', ballCY);
      });

      // Kräfte (in N)
      const Fg = m * g;
      const x_spring = y < 0 ? -y : 0;
      const Fs = k * x_spring;
      const F_SCALE = 1.2;  // px/N
      const fgLen = Fg * F_SCALE;  // immer > 0, nach unten
      const fsLen = Fs * F_SCALE;

      // Fg: Nullpunkt = ballCY, nach unten
      setArrow(fgArrow, AX[0], ballCY, AX[0], ballCY + fgLen);
      labelFg.setAttribute('x', AX[0]);
      labelFg.setAttribute('y', ballCY + fgLen + 12);
      labelFg.innerHTML = `F<tspan dy="3" font-size="8">g</tspan><tspan dy="-3">=</tspan>${Fg.toFixed(0)}N`;

      // Fs: Nullpunkt = ballCY, nach oben, nur bei Kontakt
      if (Fs > 0.5) {
        setArrow(fsArrow, AX[1], ballCY, AX[1], ballCY - fsLen);
        labelFs.setAttribute('x', AX[1]);
        labelFs.setAttribute('y', ballCY - fsLen - 4);
        labelFs.innerHTML = `F<tspan dy="3" font-size="8">f</tspan><tspan dy="-3">=</tspan>${Fs.toFixed(0)}N`;
      } else {
        setArrow(fsArrow, 0, 0, 0, 0);
        labelFs.textContent = '';
      }

      // ── Energiebalken ─────────────────────────────────────────────────────
      const ePot = m * g * y;
      const eKin = 0.5 * m * vy * vy;
      const xSpr = y < 0 ? -y : 0;
      const eSpr = 0.5 * k * xSpr * xSpr;

      // Skalierung: ePos/eNeg/eScale/zeroPct sind Modul-Konstanten, bestimmt durch Parameter

      // HTML-Energiebalken
      function setBar(zeroEl, posEl, negEl, val) {
        zeroEl.style.left = zeroPct.toFixed(2) + '%';
        if (val >= 0) {
          posEl.style.left  = zeroPct.toFixed(2) + '%';
          posEl.style.width = Math.min(val / eScale * 100, 100 - zeroPct).toFixed(2) + '%';
          negEl.style.width = '0%';
        } else {
          const wPct = Math.min(-val / eScale * 100, zeroPct);
          negEl.style.left  = (zeroPct - wPct).toFixed(2) + '%';
          negEl.style.width = wPct.toFixed(2) + '%';
          posEl.style.width = '0%';
        }
      }
      setBar(zeroPot, barPotPos, barPotNeg, ePot);
      setBar(zeroKin, barKinPos, barKinNeg, eKin);
      setBar(zeroSpr, barSprPos, barSprNeg, eSpr);
      valPot.textContent = `${ePot.toFixed(1)} J`;
      valKin.textContent = `${eKin.toFixed(1)} J`;
      valSpr.textContent = `${eSpr.toFixed(1)} J`;
      legValPot.textContent = `${ePot.toFixed(1)} J`;
      legValKin.textContent = `${eKin.toFixed(1)} J`;
      legValSpr.textContent = `${eSpr.toFixed(1)} J`;

      // Gestapelter Balken — running sum
      zeroStack.style.left = zeroPct.toFixed(2) + '%';
      let cursor = zeroPct;

      const epW = ePot / eScale * 100;  // signed
      const epStart = cursor; cursor += epW;
      const ekW = eKin / eScale * 100;
      const ekStart = cursor; cursor += ekW;
      const esW = eSpr / eScale * 100;
      const esStart = cursor; cursor += esW;

      if (epW >= 0) {
        // Kein Richtungswechsel: alle Balken in einer Zeile, volle Höhe
        stkPotNeg.style.width    = '0%';
        stkConnector.style.width = '0%';
        stkPotPos.style.top = '0'; stkPotPos.style.height = '100%';
        stkPotPos.style.left  = epStart.toFixed(2) + '%';
        stkPotPos.style.width = epW.toFixed(2) + '%';
        stkKin.style.top = '0'; stkKin.style.height = '100%';
        stkKin.style.left  = ekStart.toFixed(2) + '%';
        stkKin.style.width = ekW.toFixed(2) + '%';
        stkSpr.style.top = '0'; stkSpr.style.height = '100%';
        stkSpr.style.left  = esStart.toFixed(2) + '%';
        stkSpr.style.width = esW.toFixed(2) + '%';
      } else {
        // Richtungswechsel bei ekStart (= epStart + epW = linkes Ende von Ep)
        // Obere Hälfte: Ep geht links, untere Hälfte: Ek+Ef starten am selben Punkt
        stkPotPos.style.width = '0%';
        stkPotNeg.style.top = '0'; stkPotNeg.style.height = '50%';
        stkPotNeg.style.left  = ekStart.toFixed(2) + '%';   // linkes Ende
        stkPotNeg.style.width = Math.abs(epW).toFixed(2) + '%';
        // Verbinder am Richtungswechselpunkt
        stkConnector.style.top = '0'; stkConnector.style.height = '100%';
        stkConnector.style.left  = ekStart.toFixed(2) + '%';
        stkConnector.style.width = '2px';
        // Ek + Ef in unterer Hälfte, ab ekStart
        stkKin.style.top = '50%'; stkKin.style.height = '50%';
        stkKin.style.left  = ekStart.toFixed(2) + '%';
        stkKin.style.width = ekW.toFixed(2) + '%';
        stkSpr.style.top = '50%'; stkSpr.style.height = '50%';
        stkSpr.style.left  = esStart.toFixed(2) + '%';
        stkSpr.style.width = esW.toFixed(2) + '%';
      }
      // SVG-Energiebalken: einheitliche Skala identisch zu HTML-Balken
      // ePos (=E_START) → volle Höhe über Nulllinie; eNeg → Tiefe unter Nulllinie
      const svgPxPerJ = SCALE / (m * g);  // Ep bar top tracks ball bottom

      // Ep: positiv = nach oben, negativ = nach unten
      const potPx = ePot * svgPxPerJ;
      if (potPx >= 0) {
        svgBarPot.setAttribute('y', TRAMP_SVG - potPx);
        svgBarPot.setAttribute('height', potPx);
      } else {
        svgBarPot.setAttribute('y', TRAMP_SVG);
        svgBarPot.setAttribute('height', -potPx);
      }
      // Ek: immer positiv, nach oben
      const kinPx = eKin * svgPxPerJ;
      svgBarKin.setAttribute('y', TRAMP_SVG - kinPx);
      svgBarKin.setAttribute('height', kinPx);
      // Ef: immer positiv, nach oben
      const sprPx = eSpr * svgPxPerJ;
      svgBarSpr.setAttribute('y', TRAMP_SVG - sprPx);
      svgBarSpr.setAttribute('height', sprPx);
      // v-Pfeil: Nullpunkt = ballCY, positiv nach oben
      const V_SCALE = 30;  // px/(m/s)
      const vLen = vy * V_SCALE;
      if (Math.abs(vLen) > 2) {
        setArrow(vArrow, AX[2], ballCY, AX[2], ballCY - vLen);
        const lblY = vLen > 0 ? ballCY - vLen - 4 : ballCY - vLen + 12;
        labelV.setAttribute('x', AX[2]);
        labelV.setAttribute('y', lblY);
        labelV.textContent = `v=${vy.toFixed(1)}m/s`;
      } else {
        setArrow(vArrow, 0, 0, 0, 0);
        labelV.textContent = '';
      }
    }

    // ── Slider-Anzeige aktualisieren ─────────────────────────────────────────
    function updateSlider() {
      const pct = phaseTime / periodTime;  // 0..1
      phaseSlider.value = Math.round(pct * 1000);
      phaseLabel.textContent = `${Math.round(pct * 100)} %`;
    }

    // ── Animations-Schleife ───────────────────────────────────────────────────
    function loop(ts) {
      if (!running) return;
      if (!seeking && lastTime !== null) {
        const dt = Math.min((ts - lastTime) / 1000, 0.033);
        phaseTime = (phaseTime + dt) % periodTime;
        const s = stateAtTime(phaseTime);
        y = s.y; vy = s.vy;
        updateSlider();
      }
      lastTime = ts;
      render();
      rafId = requestAnimationFrame(loop);
    }

    // ── Button ────────────────────────────────────────────────────────────────
    btnToggle.addEventListener('click', () => {
      if (!running) {
        // Reset
        y  =  h0;
        vy =  0.0;
        phaseTime = 0;
        updateSlider();
        running = true;
        lastTime = null;
        btnToggle.textContent = 'Stop';
        rafId = requestAnimationFrame(loop);
      } else {
        running = false;
        btnToggle.textContent = 'Start';
        if (rafId) cancelAnimationFrame(rafId);
      }
    });

    // ── Slider-Steuerung ──────────────────────────────────────────────────────
    phaseSlider.addEventListener('mousedown',  () => { seeking = true; });
    phaseSlider.addEventListener('touchstart', () => { seeking = true; }, {passive: true});
    phaseSlider.addEventListener('mouseup',    () => { seeking = false; lastTime = null; });
    phaseSlider.addEventListener('touchend',   () => { seeking = false; lastTime = null; });

    phaseSlider.addEventListener('input', () => {
      const pct = phaseSlider.value / 1000;           // 0..1
      phaseTime = pct * periodTime;
      const s = stateAtTime(phaseTime);
      y = s.y; vy = s.vy;
      phaseLabel.textContent = `${Math.round(pct * 100)} %`;
      render();
    });

    btnReset.addEventListener('click', () => {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      btnToggle.textContent = 'Start';
      // Slider auf HTML-Ausgangswerte zurücksetzen
      sliderMass.value   = sliderMass.defaultValue;
      sliderHeight.value = sliderHeight.defaultValue;
      sliderK.value      = sliderK.defaultValue;
      applyParams();
    });

    // Initiale Darstellung: Parameter aus Slidern lesen
    applyParams();
  </script>
</body>
</html>
